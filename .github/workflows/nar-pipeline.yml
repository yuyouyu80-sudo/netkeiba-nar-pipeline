name: NAR daily pipeline

on:
  schedule:
    # cron はUTC基準。9:00 JST = 00:00 UTC、13:00 JST = 04:00 UTC。
    - cron: '0 0 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nar-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    outputs:
      site-ready: ${{ steps.stage-site.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve JST date
        id: date
        run: echo "date=$(TZ=Asia/Tokyo date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Fetch newspaper (race card) data
        env:
          NETKEIBA_EMAIL: ${{ secrets.NETKEIBA_EMAIL }}
          NETKEIBA_PASSWORD: ${{ secrets.NETKEIBA_PASSWORD }}
        run: python scripts/fetch_newspaper.py --date ${{ steps.date.outputs.date }} --circuit nar

      - name: Fetch race headers (race_names_nar)
        env:
          NETKEIBA_EMAIL: ${{ secrets.NETKEIBA_EMAIL }}
          NETKEIBA_PASSWORD: ${{ secrets.NETKEIBA_PASSWORD }}
        run: python scripts/predict_pattern29.py --date ${{ steps.date.outputs.date }} --circuit nar

      - name: Refresh odds / ninki / horse weight
        env:
          NETKEIBA_EMAIL: ${{ secrets.NETKEIBA_EMAIL }}
          NETKEIBA_PASSWORD: ${{ secrets.NETKEIBA_PASSWORD }}
        run: python scripts/refresh_bias.py --date ${{ steps.date.outputs.date }} --circuit nar

      - name: Regenerate predictions
        run: python scripts/predict_top5_nar.py --date ${{ steps.date.outputs.date }}

      - name: Fetch same-day quick results (nar.netkeiba.com, ahead of next-day official data)
        env:
          NETKEIBA_EMAIL: ${{ secrets.NETKEIBA_EMAIL }}
          NETKEIBA_PASSWORD: ${{ secrets.NETKEIBA_PASSWORD }}
        run: python scripts/fetch_quick_result_nar.py --date ${{ steps.date.outputs.date }}

      - name: Recalculate confidence per race
        run: python scripts/nar_model/confidence_per_race_nar.py

      - name: Build report HTML
        run: python scripts/build_artifact_nar.py

      - name: Commit updated pipeline data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nar_pipeline/
          git diff --cached --quiet || git commit -m "NAR pipeline data update ($(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST'))"
          git push

      - name: Stage GitHub Pages site
        id: stage-site
        run: |
          mkdir -p public
          cp data/nar_pipeline/prediction_report_nar.html public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    needs: run-pipeline
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
